<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">Broseph black hole</title><desc id="desc">A black and white spiral swallowing small documents, email, a spreadsheet and a chart. No toilet. Animation stops when reduced motion is preferred.</desc>
<style>
.swirl{transform-origin:160px 160px;animation:turn 24s linear infinite}
.payload{animation:fall 6.4s linear infinite;animation-delay:var(--delay);transform-origin:0 0;opacity:0}
