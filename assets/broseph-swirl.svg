@keyframes fall{0%{transform:rotate(0deg) scale(1);opacity:0}8%{opacity:1}55%{opacity:1}87%{opacity:.9}97%,100%{transform:rotate(560deg) scale(.035);opacity:0}}
@media(prefers-reduced-motion:reduce){.swirl{animation:none}.payload{animation:none;opacity:0}.static-mark{opacity:1}}
.static-mark{opacity:0}
</style>
